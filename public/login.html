<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5ef">
    <title>Sign in | Lab Booking</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/login.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="signin-panel" aria-labelledby="page-title">
        <p class="eyebrow">LAB BOOKING SYSTEM</p>
        <h1 id="page-title">Welcome back</h1>
        <p class="intro">Sign in to access your lab account.</p>

        <form id="login-form" action="/api/auth/login" method="post">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" required>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>

          <button type="submit">Sign in</button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
      <div class="side-note" aria-hidden="true">
        <span class="side-note__number">01</span>
        <span class="side-note__rule"></span>
        <span>YOUR WORKSPACE<br>STARTS HERE</span>
      </div>
    </main>
  </body>
</html>
